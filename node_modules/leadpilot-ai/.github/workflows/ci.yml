name: LeadPilot AI CRM — Continuous Integration

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  ci-pipeline:
    name: Build, Audit & Automated Test Pipeline
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      JWT_SECRET: ci_test_jwt_secret_key_32_bytes_min_length
      CRON_SECRET: ci_test_cron_secret_key_32_bytes_min
      SUPABASE_SERVICE_KEY: demo_mode

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 1. Install Dependencies
        run: npm ci

      - name: 2. ESLint Code Audit
        run: npm run lint

      - name: 3. Run Repository & Service Unit Tests
        run: npm test -- tests/unit/ --forceExit

      - name: 4. Run Controller Contract Tests
        run: npm test -- tests/contracts/ --forceExit

      - name: 5. Run API Integration Tests
        run: npm test -- tests/integration/ --forceExit

      - name: 6. Run Concurrency & Reliability Tests
        run: npm test -- tests/reliability/ --forceExit

      - name: 7. Generate Full Code Coverage Report
        run: npm run test:coverage -- --forceExit

      - name: 8. Verify Server Initialization (Build Check)
        run: node -e "const app = require('./server'); console.log('✅ Server module exports cleanly');"

      - name: Upload Coverage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage/
          retention-days: 14
